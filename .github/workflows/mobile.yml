name: Mobile builds

on:
  push:
    paths: ["pace/**", "mobile/**", "tests/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PACE_VERSION_CODE: ${{ github.run_number }}
      HAS_UPLOAD_KEY: ${{ secrets.PACE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu-latest image ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME"

      - name: Unit tests for the money rules
        run: node --test

      - name: Build the web bundle and sync it into the Android project
        working-directory: mobile
        run: |
          npm ci
          npm run sync

      - name: Build debug APK (installable on any Android phone)
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Decode upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        run: echo "${{ secrets.PACE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/pace-upload.jks"

      - name: Build signed release bundle for Google Play
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: mobile/android
        env:
          PACE_KEYSTORE: ${{ runner.temp }}/pace-upload.jks
          PACE_KEYSTORE_PASSWORD: ${{ secrets.PACE_KEYSTORE_PASSWORD }}
          PACE_KEY_ALIAS: ${{ secrets.PACE_KEY_ALIAS }}
          PACE_KEY_PASSWORD: ${{ secrets.PACE_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pace-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: pace-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Build the web bundle and sync it into the iOS project
        working-directory: mobile
        run: |
          npm ci
          npm run sync:ios

      # Compiles for the simulator without signing. This proves the iOS project builds;
      # App Store uploads need an Apple Developer account (see mobile/README.md).
      - name: Build for iOS Simulator
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}
